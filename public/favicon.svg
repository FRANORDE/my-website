<svg xmlns="http://www.w3.org/2000/svg" viewBox="74 72 360 360" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Black rounded background -->
  <rect x="74" y="72" width="360" height="360" rx="64" fill="#000"/>

  <!-- Glyph centerlines: "~/FE". Drawn twice (wide gray, then narrow black)
       so each letter looks like a hollow outline with a thick border. -->
  <defs>
    <g id="glyphs" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- tilde -->
      <path d="M112 254 C112 232 138 230 148 244 C158 258 180 260 180 238"/>
      <!-- slash -->
      <path d="M243 208 L191 302"/>
      <!-- F -->
      <path d="M279 216 V290 M279 216 H320 M279 253 H313"/>
      <!-- E -->
      <path d="M358 216 V290 M358 216 H397 M358 253 H391 M358 290 H397"/>
    </g>
  </defs>

  <use href="#glyphs" stroke="#9a9a9a" stroke-width="26"/>
  <use href="#glyphs" stroke="#000" stroke-width="10"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
